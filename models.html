<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maison Muse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap"><link rel="stylesheet" href="style.css"></head>
<body><script src="data.js"></script><script src="shared.js"></script><script>
const q=new URLSearchParams(location.search),c=q.get("category"),l=q.get("location");
const list=MODELS.filter(m=>(!c||m.category===c)&&(!l||m.location===l));
const chip=(h,t,on)=>`<a class="chip ${on?"on":""}" href="${h}">${t}</a>`;
layout("models.html",head(SITE.profilesTitle,SITE.profilesQuote)+`<section><div class="chips">${chip("models.html","All",!c&&!l)}${CATEGORIES.map(x=>chip("models.html?category="+x.id,x.name,c===x.id)).join("")}</div><div class="chips">${LOCATIONS.map(x=>chip("models.html?location="+encodeURIComponent(x),x,l===x)).join("")}</div>
<div class="grid">${list.length?list.map(card).join(""):"<p class='sub'>No profiles here yet. Try another category or location.</p>"}</div></section>`);
</script></body></html>
